name: "[dev] Deploy admin-backend"

on:
  push:
    branches:
      - dev

jobs:
  deploy_admin_backend:
    uses: ./.github/workflows/dvpn-admin-backend-service.yaml
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: "ap-southeast-3"
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Dvpn-admin-backend/deployment.yaml
      HUAWEI_IMAGE: dev-dvpn-admin-backend
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.DEV_FRONTEND }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
